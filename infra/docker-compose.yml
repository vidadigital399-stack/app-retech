services:
  api:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
  web:
    build:
      context: ../frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: retec
      POSTGRES_USER: retec
      POSTGRES_PASSWORD: retec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
